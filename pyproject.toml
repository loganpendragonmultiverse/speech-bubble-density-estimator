[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-bubble-density-estimator"
version = "2.0.0"
description = "Estimate dialogue-heavy comic pages from local image contrast patterns without OCR."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["Pillow>=13.0.0,<14"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
bubble-density = "speech_bubble_density_estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
omit = ["src/*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=speech_bubble_density_estimator --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.setuptools.data-files]
"share/doc/speech-bubble-density-estimator" = ["README.md", "CHANGELOG.md", "DEVELOPMENT.md", "TESTING.md"]

"share/doc/speech-bubble-density-estimator/examples" = ["examples/README.md", "examples/profiles.json", "examples/labels.json"]
